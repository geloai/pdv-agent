# Render's free instances sleep after 15 minutes without traffic and can take minutes to wake up.
# The PDV demo runs on a paid instance and never sleeps, so only Jadran Solar (free) is pinged.
# It is the only free service, so Render's 750 free instance hours per month cover it around the clock.
# GitHub may delay or skip scheduled runs, so this keeps the demo awake most of the time, not always.
name: Keep demos awake

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

env:
  JADRAN: https://jadran-solar.onrender.com/

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Ping Jadran Solar
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 120 --retry 4 --retry-delay 20 --retry-all-errors "$JADRAN" || true)
          echo "$JADRAN -> $code"
