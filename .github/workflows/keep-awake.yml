# Render's free instances sleep after 15 minutes without traffic and can take minutes to wake up.
# This pings the public demos during working hours so they respond immediately.
# Working hours only, to stay within Render's 750 free instance hours per month (two services).
name: Keep demos awake

on:
  schedule:
    # Every 10 minutes, Monday–Friday, 05:00–18:59 UTC (07–21 h Croatian summer time, 06–20 h winter time)
    - cron: '*/10 5-18 * * 1-5'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Ping demos
        run: |
          for url in https://pdv-agent-wu6l.onrender.com/api/ured https://jadran-solar.onrender.com/; do
            code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 120 --retry 4 --retry-delay 20 --retry-all-errors "$url" || true)
            echo "$url -> $code"
          done
