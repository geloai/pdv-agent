# Render's free instances sleep after 15 minutes without traffic and can take minutes to wake up.
# This pings the public demos so they respond immediately.
# Working hours only, to stay within Render's 750 free instance hours per month (two services),
# plus one-off weekend windows for the PDV demo listed in WEEKEND_DATES.
name: Keep demos awake

on:
  schedule:
    # Working hours: every 10 minutes, Monday–Friday, 05:00–18:59 UTC (07–21 h Croatian summer time)
    - cron: '*/10 5-18 * * 1-5'
    # Weekend window (PDV demo only, and only on the dates below): Fri evening, Sat, Sun, Mon early morning
    - cron: '*/10 19-23 * * 5'
    - cron: '*/10 * * * 0,6'
    - cron: '*/10 0-4 * * 1'
  workflow_dispatch:

env:
  PDV: https://pdv-agent-wu6l.onrender.com/api/ured
  JADRAN: https://jadran-solar.onrender.com/
  # UTC dates on which the weekend window is active
  WEEKEND_DATES: '2026-10-16 2026-10-17 2026-10-18 2026-10-19'

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Ping demos
        env:
          SCHEDULE: ${{ github.event.schedule }}
        run: |
          if [ -z "$SCHEDULE" ] || [ "$SCHEDULE" = '*/10 5-18 * * 1-5' ]; then
            urls="$PDV $JADRAN"
          elif echo " $WEEKEND_DATES " | grep -q " $(date -u +%F) "; then
            urls="$PDV"
          else
            echo "Weekend window not active today ($(date -u +%F)), nothing to do."
            exit 0
          fi
          for url in $urls; do
            code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 120 --retry 4 --retry-delay 20 --retry-all-errors "$url" || true)
            echo "$url -> $code"
          done
