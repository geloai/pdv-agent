# Render's free instances sleep after 15 minutes without traffic and can take minutes to wake up.
# This pings the public demos so they respond immediately, while staying within Render's
# 750 free instance hours per month (shared by both services):
#   - PDV demo: around the clock until PDV_ALWAYS_UNTIL, then working hours only
#   - Jadran Solar: working hours only (Monday–Friday, 05:00–18:59 UTC = 07–21 h Croatian summer time)
name: Keep demos awake

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

env:
  PDV: https://pdv-agent-wu6l.onrender.com/api/ured
  JADRAN: https://jadran-solar.onrender.com/
  PDV_ALWAYS_UNTIL: '2026-10-31'

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Ping demos
        run: |
          today=$(date -u +%F); hour=$(date -u +%H); dow=$(date -u +%u)   # dow: 1 = Monday … 7 = Sunday
          working=false
          if [ "$dow" -le 5 ] && [ "$hour" -ge 5 ] && [ "$hour" -le 18 ]; then working=true; fi

          urls=""
          if [ "$working" = true ] || [[ ! "$today" > "$PDV_ALWAYS_UNTIL" ]]; then urls="$PDV"; fi
          if [ "$working" = true ]; then urls="$urls $JADRAN"; fi
          if [ -z "$urls" ]; then echo "Outside the keep-awake window ($today $hour:xx UTC)."; exit 0; fi

          for url in $urls; do
            code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 120 --retry 4 --retry-delay 20 --retry-all-errors "$url" || true)
            echo "$url -> $code"
          done
